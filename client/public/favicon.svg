<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Workspace Assistant: stacked documents with an AI sparkle, Primer blue -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#218bff"/>
      <stop offset="1" stop-color="#0550ae"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- back page (another workspace) -->
  <rect x="11.5" y="4" width="15" height="18" rx="3" fill="#fff" fill-opacity=".5"/>
  <!-- front page with two text lines -->
  <rect x="5.5" y="8" width="15" height="20" rx="3" fill="#fff"/>
  <rect x="9" y="13" width="8" height="2.4" rx="1.2" fill="#0969da"/>
  <rect x="9" y="18" width="5" height="2.4" rx="1.2" fill="#0969da"/>
  <!-- AI sparkle -->
  <path d="M23.5 15.5c.6 3.4 2 4.9 5.5 5.5-3.5.6-4.9 2-5.5 5.5-.6-3.5-2-4.9-5.5-5.5 3.5-.6 4.9-2.1 5.5-5.5z" fill="#ffd33d" stroke="#0550ae" stroke-width="1.6" stroke-linejoin="round" paint-order="stroke"/>
</svg>
